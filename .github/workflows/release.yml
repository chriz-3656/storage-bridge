name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Artifacts
        run: |
          mkdir -p build
          
          echo "Building for Linux..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/storage-bridge-linux-amd64 ./cmd/storage-bridge
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/storage-bridge-linux-arm64 ./cmd/storage-bridge
          
          echo "Building for Windows..."
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o build/storage-bridge-windows-amd64.exe ./cmd/storage-bridge
          
          echo "Building for macOS..."
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o build/storage-bridge-macos-amd64 ./cmd/storage-bridge
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o build/storage-bridge-macos-arm64 ./cmd/storage-bridge
          
          echo "Generating Checksums..."
          cd build
          sha256sum * > checksums.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
