name: Build Storage-Bridge

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Fetch dependencies
      run: go mod tidy

    - name: Build Binary
      run: |
        mkdir -p build
        GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -o build/storage-bridge-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/storage-bridge

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: storage-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
        path: build/storage-bridge-*
